<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hobbyverse Hub</title>
  
  <!-- CONFIGURAZIONE PWA WEB APP -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#090a0f">
  <link rel="apple-touch-icon" href="image_7a0c9d.jpg">

  <style>
    :root {
      --bg-dark: #090a0f;
      --card-bg: #1e293b;
      --accent-gold: #fbbf24;
      --border-color: rgba(255, 255, 255, 0.15);
      --poke-accent: #3b82f6;
      --ok-green: #22c55e;
      --term-green: #34d399;
      --missing-red: #ef4444;
      --purple-accent: #a855f7;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-dark); color: #fff; min-height: 100vh; overflow-x: hidden; }

    .back-btn {
      position: absolute; top: 16px; left: 16px; z-index: 30;
      background: rgba(15, 23, 42, 0.8); border: 1px solid var(--border-color);
      color: #fff; padding: 8px 16px; border-radius: 20px; cursor: pointer;
      backdrop-filter: blur(8px); transition: background 0.2s, transform 0.1s;
    }
    .back-btn:hover { background: var(--accent-gold); color: #000; transform: scale(1.05); }

    /* HUB INIZIALE */
    #home-view { display: flex; flex-direction: column; align-items: center; padding: 32px 16px; min-height: 100vh; }
    .header-title { text-align: center; margin-bottom: 28px; }
    .header-title h1 {
      font-size: 2.4rem;
      background: linear-gradient(45deg, #fbbf24, #f59e0b, #ec4899);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    .planets-grid { display: flex; justify-content: center; gap: 30px; flex-wrap: wrap; margin-top: 20px; }
    .hobby-planet-card { display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: transform 0.3s; }
    .hobby-planet-card:hover { transform: scale(1.08); }
    .planet-sphere {
      width: 110px; height: 110px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; font-size: 2.5rem;
      box-shadow: 0 0 25px rgba(255,255,255,0.2);
    }

    /* VISTA FUMETTI */
    #comics-view {
      display: none; position: relative; width: 100vw; height: 100vh;
      background: linear-gradient(to bottom, #050608 0%, #0d1322 40%, #2a0e2a 75%, #4a1528 100%); overflow: hidden;
    }
    .stars-bg {
      position: absolute; top: 0; left: 0; width: 100%; height: 60%;
      background-image: radial-gradient(1.5px 1.5px at 12% 18%, #fff, rgba(0,0,0,0)), radial-gradient(2px 2px at 28% 38%, #ffd, rgba(0,0,0,0));
      background-repeat: repeat; background-size: 320px 220px; opacity: 0.9; z-index: 2;
    }
    .sky-objects {
      position: absolute; top: 12%; left: 5%; right: 5%; height: 40%;
      display: flex; justify-content: space-around; align-items: center; z-index: 10; flex-wrap: wrap;
    }
    .planet { border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; position: relative; transition: transform 0.3s; }
    .planet:hover { transform: scale(1.15); }
    .planet-dc { width: 85px; height: 85px; background: radial-gradient(circle at 30% 30%, #60a5fa, #1d4ed8); box-shadow: 0 0 20px rgba(59, 130, 246, 0.5); }
    .planet-marvel { width: 85px; height: 85px; background: radial-gradient(circle at 30% 30%, #f87171, #b91c1c); box-shadow: 0 0 20px rgba(239, 68, 68, 0.5); }
    .planet-manga { width: 65px; height: 65px; background: radial-gradient(circle at 30% 30%, #f472b6, #db2777); box-shadow: 0 0 15px rgba(236, 72, 153, 0.5); }

    .ground { position: absolute; bottom: 0; width: 100%; height: 38%; background: linear-gradient(to bottom, #b45309 0%, #78350f 100%); z-index: 5; }
    .dirt-road {
      position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; height: 38%;
      background: linear-gradient(to bottom, #87380c, #b45309); clip-path: polygon(47% 0%, 53% 0%, 82% 100%, 18% 100%); opacity: 0.85; z-index: 6;
    }
    .terminal-station { position: absolute; right: 8%; bottom: 12%; z-index: 15; cursor: pointer; text-align: center; }
    .computer-box { width: 80px; height: 65px; background: #334155; border: 3px solid #1e293b; border-radius: 6px; display: flex; align-items: center; justify-content: center; }
    .computer-screen { width: 85%; height: 80%; background: #022c22; border: 1px solid #10b981; color: #34d399; font-family: monospace; font-size: 0.65rem; }

    /* MODALE TERMINALE COMICS */
    .terminal-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.88); z-index: 100; backdrop-filter: blur(6px); padding: 20px 12px; overflow-y: auto; }
    .terminal-card { background: #0f172a; border: 2px solid #10b981; border-radius: 16px; max-width: 900px; margin: 0 auto; padding: 20px; }
    .term-tab { background: #1e293b; border: 1px solid #10b981; color: var(--term-green); padding: 6px 12px; border-radius: 8px; cursor: pointer; font-family: monospace; font-size: 0.8rem; margin-right: 4px; margin-bottom: 6px; }
    .term-tab.active { background: #10b981; color: #000; font-weight: bold; }

    .run-item-card { background: #1e293b; border: 1px solid var(--border-color); border-radius: 10px; padding: 10px 14px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
    .tag-btn { font-size: 0.72rem; padding: 3px 8px; border-radius: 10px; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
    .tag-read.letto { background: rgba(52, 211, 153, 0.2); color: #34d399; border: 1px solid #10b981; }
    .tag-read.da_leggere { background: rgba(251, 191, 36, 0.2); color: #fbbf24; border: 1px solid #f59e0b; }
    .tag-phys.posseduto { background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid #3b82f6; }
    .tag-phys.manca { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }

    /* POKÉMON HUB */
    #pokemon-view { display: none; position: relative; width: 100vw; min-height: 100vh; background: #0f172a; padding: 20px; overflow-y: auto; }
    .poke-nav-tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .poke-tab-btn { background: #1e293b; border: 1px solid var(--border-color); padding: 8px 16px; border-radius: 12px; font-size: 0.85rem; font-weight: 600; color: #cbd5e1; cursor: pointer; }
    .poke-tab-btn.active { background: #3b82f6; color: #fff; border-color: #60a5fa; }

    .pkm-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; margin-top: 10px; }
    .pkm-card { background: #1e293b; border: 1px solid var(--border-color); border-radius: 10px; padding: 8px; text-align: center; color: #fff; }
    .pkm-card.checked { border-color: #22c55e; background: rgba(34, 197, 94, 0.15); }
    .pkm-art { width: 100%; aspect-ratio: 3/4; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.1rem; color: #fff; background: linear-gradient(135deg, #3b82f6, #6366f1); margin-bottom: 6px; }

    /* WANTS / CARTE SINGOLE STILE TCG DRAGON */
    .wants-header { background: linear-gradient(135deg, #3b82f6, #8b5cf6); border-radius: 16px; padding: 16px 20px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    .accordion-item { background: #1e293b; border: 1px solid var(--border-color); border-radius: 12px; margin-bottom: 10px; overflow: hidden; }
    .accordion-header { padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; background: rgba(255,255,255,0.03); font-weight: 600; }
    .accordion-header:hover { background: rgba(255,255,255,0.07); }
    .accordion-content { padding: 14px; display: none; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; background: rgba(0,0,0,0.2); }
    .accordion-item.open .accordion-content { display: grid; }

    .single-card { background: #0f172a; border: 1px solid var(--border-color); border-radius: 10px; padding: 10px; display: flex; gap: 12px; align-items: center; }
    .single-art { width: 60px; height: 84px; border-radius: 6px; background: #334155; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.8rem; text-align: center; }
    .single-info { flex: 1; }
    .single-title { font-weight: bold; font-size: 0.9rem; margin-bottom: 2px; }
    .single-sub { font-size: 0.72rem; color: #94a3b8; margin-bottom: 6px; }
    .price-tag { font-weight: bold; color: var(--accent-gold); font-size: 0.85rem; }

    /* VISTA LIBRI CON MASCOTTE */
    #books-view { display: none; position: relative; width: 100vw; min-height: 100vh; background: linear-gradient(135deg, #1e1b4b, #311042); padding: 32px 16px; }
    .books-header { display: flex; align-items: center; justify-content: center; gap: 20px; max-width: 800px; margin: 0 auto 30px auto; background: rgba(255,255,255,0.05); padding: 16px 24px; border-radius: 20px; border: 1px solid var(--border-color); }
    .mascot-img { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent-gold); }

    /* MODALE LUCCA OFF-LINE */
    .lucca-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 150; padding: 20px; overflow-y: auto; }
    .lucca-card { background: #0f172a; border: 2px solid var(--accent-gold); border-radius: 16px; max-width: 700px; margin: 0 auto; padding: 20px; }
  </style>
</head>
<body>

  <!-- HUB INIZIALE -->
  <div id="home-view">
    <div class="header-title">
      <h1>🛸 Hobbyverse Hub</h1>
      <p>Gestione Unificata Fumetti, Pokémon & Libri</p>
    </div>

    <div class="planets-grid">
      <div class="hobby-planet-card" onclick="openView('comics-view')">
        <div class="planet-sphere" style="background: radial-gradient(circle at 30% 30%, #d97706, #78350f);">🌌</div>
        <span style="margin-top:10px; font-weight:bold;">Outback Fumetti</span>
      </div>

      <div class="hobby-planet-card" onclick="openView('pokemon-view')">
        <div class="planet-sphere" style="background: radial-gradient(circle at 30% 30%, #38bdf8, #1e3a8a);">⚡</div>
        <span style="margin-top:10px; font-weight:bold;">Pokémon World</span>
      </div>

      <div class="hobby-planet-card" onclick="openView('books-view')">
        <div class="planet-sphere" style="background: radial-gradient(circle at 30% 30%, #a855f7, #581c87);">📜</div>
        <span style="margin-top:10px; font-weight:bold;">Biblioteca Libri</span>
      </div>
    </div>
  </div>

  <!-- OUTBACK FUMETTI -->
  <div id="comics-view">
    <button class="back-btn" onclick="openHome()">⬅️ Home Hub</button>
    <div class="stars-bg"></div>

    <div class="sky-objects">
      <div class="planet planet-dc" onclick="openTerminalModal('dc')">
        <span style="position:absolute; bottom:-22px; font-size:0.75rem; font-weight:bold; color:#60a5fa;">🌌 DC Universe</span>
      </div>
      <div class="planet planet-marvel" onclick="openTerminalModal('marvel')">
        <span style="position:absolute; bottom:-22px; font-size:0.75rem; font-weight:bold; color:#f87171;">🚀 Marvel Universe</span>
      </div>
      <div class="planet planet-manga" onclick="openTerminalModal('manga')">
        <span style="position:absolute; bottom:-20px; font-size:0.7rem; font-weight:bold; color:#f472b6;">🌸 Manga</span>
      </div>
    </div>

    <div class="ground"></div>
    <div class="dirt-road"></div>

    <div class="terminal-station" onclick="openTerminalModal('all')">
      <div class="computer-box">
        <div class="computer-screen">> COMIC<br>DATABASE</div>
      </div>
    </div>
  </div>

  <!-- MODALE TERMINALE COMICS -->
  <div class="terminal-modal" id="terminalModal">
    <div class="terminal-card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; flex-wrap:wrap; gap:8px;">
        <h2 style="color:var(--term-green); font-family:monospace; font-size:1.2rem;">🖥️ Database Fumetti</h2>
        <div style="display:flex; gap:8px;">
          <button style="background:var(--accent-gold); color:#000; border:none; padding:6px 12px; border-radius:8px; font-weight:bold; cursor:pointer;" onclick="openLuccaModal()">⚡ Lucca Mode & Export</button>
          <button class="back-btn" style="position:static;" onclick="closeTerminalModal()">Chiudi ✖</button>
        </div>
      </div>

      <div style="margin-bottom: 12px; display:flex; gap:6px; flex-wrap:wrap;">
        <button class="term-tab active" id="term-tab-all" onclick="filterComics('all')">🌐 Tutti</button>
        <button class="term-tab" id="term-tab-dc" onclick="filterComics('dc')">🌌 DC</button>
        <button class="term-tab" id="term-tab-marvel" onclick="filterComics('marvel')">🚀 Marvel</button>
        <button class="term-tab" id="term-tab-manca" onclick
