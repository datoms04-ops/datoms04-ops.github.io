<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Hobbyverse v8.0 Full Fixed</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d0e12">

  <!-- Chart.js 4.4.7 -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js" integrity="sha384-jB0G5xM2+9PblJ9s6iG0F1J35lX5jXq6N7D7L+a3C0aG9J9l8A==" crossorigin="anonymous"></script>

  <style>
    :root {
      --bg-main: #0d0e12;
      --card-bg: #16181e;
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-gold: #fbbf24;
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --accent-blue: #3b82f6;
      --accent-orange: #f97316;
      --accent-purple: #a855f7;
      --text-muted: #94a3b8;
      --sab: env(safe-area-inset-bottom, 0px);
      --sat: env(safe-area-inset-top, 0px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    
    html, body {
      background-color: var(--bg-main);
      color: #fff;
      min-height: 100dvh;
      width: 100%;
      overflow-x: hidden;
      padding-bottom: calc(85px + var(--sab));
      user-select: none;
      -webkit-user-select: none;
    }

    input, select, textarea {
      user-select: text !important;
      -webkit-user-select: text !important;
    }

    /* HEADER NATIVO */
    .app-header {
      position: sticky; top: 0; z-index: 50;
      background: rgba(13, 14, 18, 0.95);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--card-border);
      padding: calc(12px + var(--sat)) 16px 12px 16px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .app-title { font-weight: 900; font-size: 1.1rem; letter-spacing: -0.5px; display: flex; align-items: center; gap: 8px; }
    .version-badge { font-size: 0.7rem; color: var(--accent-gold); font-weight: 800; background: rgba(251, 191, 36, 0.12); padding: 3px 8px; border-radius: 12px; border: 1px solid rgba(251, 191, 36, 0.3); }

    /* SEARCH BAR */
    .search-bar-container { padding: 10px 16px; background: #12141a; border-bottom: 1px solid var(--card-border); }
    .search-input {
      width: 100%; padding: 10px 14px; background: #16181e; border: 1px solid var(--card-border);
      border-radius: 12px; color: #fff; font-size: 0.85rem; outline: none;
    }

    /* HERO STATS BAR */
    .hero-stats-bar {
      display: flex; justify-content: space-between; align-items: center;
      background: #12141a; border-bottom: 1px solid var(--card-border);
      padding: 8px 16px; font-size: 0.78rem; color: var(--text-muted);
    }
    .hero-stats-bar b { color: #fff; font-weight: 800; }
    .kpi-pill-btn {
      background: rgba(255,255,255,0.05); border: 1px solid var(--card-border);
      padding: 3px 8px; border-radius: 8px; cursor: pointer; color: var(--text-muted); font-size: 0.78rem;
    }
    .kpi-pill-btn.active { border-color: var(--accent-gold); color: var(--accent-gold); background: rgba(251, 191, 36, 0.1); }

    /* SUB-TAB SWITCHER */
    .sub-tab-switcher {
      display: flex; margin: 12px 16px; background: #16181e;
      border: 1px solid var(--card-border); border-radius: 14px; padding: 4px; gap: 4px;
    }
    .sub-btn {
      flex: 1; padding: 8px 4px; text-align: center; font-weight: 800; font-size: 0.78rem;
      border-radius: 10px; border: none; cursor: pointer; color: var(--text-muted); background: transparent; transition: all 0.2s ease;
    }
    .sub-btn.active { background: #fff; color: #000; box-shadow: 0 2px 8px rgba(0,0,0,0.4); }

    /* CHIPS EDITORI */
    .chips-scroll-container {
      display: flex; gap: 8px; padding: 0 16px 10px 16px; overflow-x: auto; scrollbar-width: none;
      scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch;
    }
    .chips-scroll-container::-webkit-scrollbar { display: none; }
    
    .chip-item {
      scroll-snap-align: start; flex-shrink: 0;
      background: var(--card-bg); border: 1px solid var(--card-border);
      color: var(--text-muted); padding: 6px 14px; border-radius: 20px;
      font-size: 0.78rem; font-weight: 700; white-space: nowrap; cursor: pointer; transition: all 0.2s;
    }
    .chip-item.active { background: var(--accent-gold); color: #000; border-color: var(--accent-gold); }

    /* CARDS RUN */
    .run-card {
      background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: 16px; padding: 14px 16px; margin: 0 16px 12px 16px; position: relative;
    }
    .run-card.abandoned { opacity: 0.7; border-style: dashed; }
    .run-header-row { display: flex; justify-content: space-between; align-items: center; width: 100%; background: none; border: none; text-align: left; color: inherit; cursor: pointer; }
    .run-title { font-weight: 800; font-size: 0.95rem; color: #fff; display: flex; align-items: center; gap: 8px; }
    .run-meta { font-size: 0.73rem; color: var(--text-muted); margin-top: 2px; }

    .toggle-arrow {
      background: rgba(255,255,255,0.06); border: 1px solid var(--card-border);
      width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 0.75rem; color: var(--accent-gold); transition: transform 0.2s; pointer-events: none; flex-shrink: 0;
    }
    .toggle-arrow.open { transform: rotate(180deg); }

    .run-body { display: none; margin-top: 12px; }
    .run-body.open { display: block; }

    .progress-bar-bg { width: 100%; height: 6px; background: #262933; border-radius: 3px; overflow: hidden; margin-bottom: 12px; }
    .progress-bar-fill { height: 100%; background: var(--accent-green); }
    .progress-bar-fill.digital { background: var(--accent-blue); }

    /* TASSELLI NUMERATI */
    .numbers-grid { display: flex; flex-wrap: wrap; gap: 6px; }
    .num-tile {
      width: 34px; height: 34px; border-radius: 10px; font-size: 0.8rem; font-weight: 700;
      display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative;
      border: 1px solid var(--card-border); background: #1e212b; color: #94a3b8; transition: transform 0.1s;
    }
    .num-tile:active { transform: scale(0.92); }
    .num-tile.owned { background: rgba(34, 197, 94, 0.2); border-color: var(--accent-green); color: #4ade80; }
    .num-tile.incoming { background: rgba(249, 115, 22, 0.25); border-color: var(--accent-orange); color: #fb923c; }
    .num-tile.read { background: rgba(59, 130, 246, 0.2); border-color: var(--accent-blue); color: #60a5fa; }

    /* CARDS SPESE / STATS */
    .expense-card {
      background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: 16px; padding: 16px; margin: 0 16px 12px 16px;
    }
    .expense-header-title { font-weight: 800; font-size: 0.95rem; color: #fff; margin-bottom: 8px; }

    /* FAB ADD BUTTON */
    .fab-add {
      position: fixed; bottom: calc(75px + var(--sab)); right: 18px; width: 54px; height: 54px;
      background: var(--accent-gold); color: #000; border-radius: 50%; border: none;
      display: flex; align-items: center; justify-content: center; font-size: 1.6rem;
      box-shadow: 0 6px 20px rgba(251, 191, 36, 0.4); z-index: 60; cursor: pointer;
    }

    /* MODALE BOTTOM SHEET */
    .modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); z-index: 100; align-items: flex-end;
    }
    .modal-overlay.open { display: flex; }

    .bottom-sheet {
      background: #16181e; border-top-left-radius: 24px; border-top-right-radius: 24px;
      border: 1px solid var(--card-border); width: 100%; max-height: 85vh;
      padding: 20px 20px calc(20px + var(--sab)) 20px;
      overflow-y: auto; animation: slideUp 0.25s ease-out;
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

    /* BOX COPERTINA NELLA MODALE */
    .cover-box-large {
      width: 140px; height: 210px; border-radius: 14px; background: linear-gradient(135deg, #1e212b, #0d0e12); margin: 0 auto 14px auto;
      display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 0.85rem; color: #fff;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7); background-size: cover; background-repeat: no-repeat; background-position: center; border: 1px solid var(--card-border);
      text-align: center; padding: 12px; font-weight: bold; position: relative; overflow: hidden;
    }

    .edit-input-field, .edit-select-field {
      width: 100%; padding: 10px; background: #12141a; border: 1px solid var(--card-border);
      border-radius: 8px; color: #fff; font-size: 0.88rem; margin-top: 4px; margin-bottom: 12px;
    }

    .btn-save-modal {
      width: 100%; padding: 12px; border-radius: 10px; font-weight: bold; border: none;
      background: var(--accent-gold); color: #000; cursor: pointer; margin-top: 10px; font-size: 0.9rem;
    }

    /* BOTTOM NAV BAR */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; height: calc(60px + var(--sab));
      background: rgba(13, 14, 18, 0.95); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid var(--card-border);
      display: flex; justify-around: space-around; align-items: center; z-index: 50;
      padding-bottom: var(--sab);
    }
    .nav-btn { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #64748b; font-size: 0.68rem; font-weight: 600; cursor: pointer; background: none; border: none; }
    .nav-btn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .nav-btn.active { color: var(--accent-gold); }
    .nav-btn.active svg { stroke: var(--accent-gold); }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="app-header">
    <div class="app-title">📖 Hobbyverse</div>
    <div class="version-badge">v8.0 Full Fixed</div>
  </header>

  <!-- SEARCH BAR -->
  <div class="search-bar-container">
    <input type="text" id="globalSearchInput" class="search-input" placeholder="🔍 Cerca serie o autore..." aria-label="Cerca">
  </div>

  <!-- HERO STATS BAR -->
  <div class="hero-stats-bar">
    <span>Posseduti: <b id="st-val1">0</b></span>
    <button class="kpi-pill-btn" id="btn-hunt-mode" onclick="toggleHuntingMode()">🎯 Mancanti: <b id="st-val3">0</b></button>
    <span>Spesa: <b style="color:var(--accent-gold);" id="st-val4">0,00 €</b></span>
  </div>

  <!-- HOME DASHBOARD -->
  <main id="viewHome" style="display:block; padding:16px;">
    <div id="incomingBannerContainer" style="display:none; margin-bottom:12px;" class="expense-card">
      <div class="expense-header-title" style="color:var(--accent-orange);">🚚 Pacchi In Arrivo (<span id="incomingCountVal">0</span>)</div>
      <div id="incomingListItems" style="font-size:0.8rem; color:var(--text-muted); margin-top:6px;"></div>
    </div>

    <div class="expense-card" style="margin:0;">
      <div class="expense-header-title">⚡ Menu Rapido</div>
      <div style="display:flex; gap:8px; margin-top:8px;">
        <button onclick="switchBottomNav('inventory')" style="flex:1; background:var(--accent-gold); color:#000; padding:12px; border-radius:12px; font-weight:800; border:none; cursor:pointer;">📦 Inventario</button>
        <button onclick="openAddModal()" style="flex:1; background:rgba(255,255,255,0.05); border:1px solid var(--card-border); color:#fff; padding:12px; border-radius:12px; font-weight:700; cursor:pointer;">➕ Nuovo Volume</button>
      </div>
    </div>
  </main>

  <!-- INVENTARIO -->
  <div id="viewInventory" style="display:none;">
    <div class="sub-tab-switcher">
      <button class="sub-btn active" id="btnSubPhysical" onclick="switchSubTab('physical')">📖 Cartacei (<span id="cnt-phys-total">0</span>)</button>
      <button class="sub-btn" id="btnSubDigital" onclick="switchSubTab('digital')">📱 Online (<span id="cnt-dig-total">0</span>)</button>
    </div>

    <div class="chips-scroll-container" id="chipsContainer">
      <button class="chip-item active" onclick="filterPublisher('ALL', this)">🌟 Tutti</button>
      <button class="chip-item" onclick="filterPublisher('DC', this)">🔵 DC Comics</button>
      <button class="chip-item" onclick="filterPublisher('Marvel', this)">🔴 Marvel</button>
      <button class="chip-item" onclick="filterPublisher('PK', this)">💜 PK / Disney</button>
      <button class="chip-item" onclick="filterPublisher('Manga', this)">🌸 Manga</button>
      <button class="chip-item" onclick="filterPublisher('Altro', this)">📚 Altro</button>
    </div>

    <div id="subViewPhysical">
      <div id="physicalRunsContainer"></div>
    </div>
    <div id="subViewDigital" style="display:none;">
      <div id="digitalRunsContainer"></div>
    </div>
  </div>

  <!-- ANALYTICS SPESE -->
  <div id="viewExpenses" style="display:none; padding-top:10px;">
    <div class="expense-card">
      <div class="expense-header-title">🛍️ Canali d'Acquisto & Spese Vinted</div>
      <div style="font-size:0.85rem; color:var(--text-muted); margin-bottom:4px;"><b>Vinted (Oggetti):</b> <span id="expVintedVal">0,00 €</span></div>
      <div style="font-size:0.75rem; color:var(--accent-orange); padding-left:10px;">├ Spedizioni: <b id="expVintedShipVal">0,00 €</b></div>
      <div style="font-size:0.75rem; color:var(--accent-purple); padding-left:10px;">└ Protezione: <b id="expVintedFeeVal">0,00 €</b></div>
      <div style="font-size:0.85rem; color:var(--text-muted); margin-top:6px;"><b>Fumetteria:</b> <span id="expFumetteriaVal">0,00 €</span></div>
      <div style="font-size:0.85rem; color:var(--text-muted); margin-top:4px;"><b>Lucca C&G / Fiera:</b> <span id="expLuccaVal">0,00 €</span></div>
    </div>
  </div>

  <!-- FAB ADD BUTTON -->
  <button class="fab-add" onclick="openAddModal()" aria-label="Aggiungi">➕</button>

  <!-- MODALE -->
  <div class="modal-overlay" id="itemModal">
    <div class="bottom-sheet">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
        <h3 id="m-title" style="font-size:1.1rem; color:#fff;">Dettaglio Volume</h3>
        <button onclick="closeModal()" style="background:none; border:none; font-size:1.4rem; color:#94a3b8; cursor:pointer;">✖</button>
      </div>

      <div class="cover-box-large" id="m-cover">
        <div id="m-cover-placeholder">Copertina</div>
      </div>

      <div id="modalFormContent">
        <label style="font-size:0.72rem; color:var(--text-muted);">📚 Titolo Serie:</label>
        <input type="text" id="editTitleInput" class="edit-input-field">

        <label style="font-size:0.72rem; color:var(--text-muted);">🔢 Numero Volume:</label>
        <input type="number" id="editIssueNumInput" class="edit-input-field" value="1">

        <label style="font-size:0.72rem; color:var(--text-muted);">🔗 URL Copertina / Variant (GitHub Raw / Web):</label>
        <input type="text" id="editCoverUrlInput" class="edit-input-field" placeholder="https://raw.githubusercontent.com/username/repo/main/img/cover.jpg">

        <label style="font-size:0.72rem; color:var(--text-muted);">📍 Canale Acquisto:</label>
        <select id="sourceTypeSelect" class="edit-select-field">
          <option value="vinted">Vinted</option>
          <option value="fumetteria">Fumetteria</option>
          <option value="lucca">Lucca C&G</option>
          <option value="regalo">Regalo</option>
        </select>

        <label style="font-size:0.72rem; color:var(--text-muted);">💰 Prezzo Oggetto (€):</label>
        <input type="number" id="editPriceInput" class="edit-input-field" step="0.01" value="0.00">

        <button class="btn-save-modal" onclick="saveModalItem()">💾 Salva Modifiche</button>
      </div>
    </div>
  </div>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <button class="nav-btn active" id="navHome" onclick="switchBottomNav('home')">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
      <span>Home</span>
    </button>
    <button class="nav-btn" id="navInventory" onclick="switchBottomNav('inventory')">
      <svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 21 16z"></path></svg>
      <span>Inventario</span>
    </button>
    <button class="nav-btn" id="navExpenses" onclick="switchBottomNav('expenses')">
      <svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line></svg>
      <span>Spese</span>
    </button>
  </nav>

      { id: "tapum-ortolani", title: "Tapum! (Storie di guerra)", publisher: "Feltrinelli Comics", category: "Altro", year: "2024", total: 1, owned: [1], incoming: [], isAbandoned: false, luccaItems: [], prices: { 1: 0.00 }, sources: { 1: "regalo" } },
      { id: "death-note", title: "Death Note", publisher: "Planet Manga", category: "Manga", year: "2006", total: 13, owned: [1,2,4,7,12,13], incoming: [], isAbandoned: false, luccaItems: [], prices: {}, sources: {} },

      { id: "slam-dunk-manga", title: "Slam Dunk", publisher: "Planet Manga", category: "Manga", year: "2026", total: 24, owned: [], incoming: [1], isAbandoned: false, luccaItems: [], prices: { 1: 3.00 }, sources: { 1: "vinted" }, vintedShipping: { 1: 1.69 }, vintedFees: { 1: 0.85 } },
      { id: "invincible-omnibus", title: "Invincible Omnibus (Saldapress)", publisher: "Saldapress", category: "Altro", year: "2026", total: 1, owned: [], incoming: [1], isAbandoned: false, luccaItems: [], prices: { 1: 23.00 }, sources: { 1: "vinted" }, vintedShipping: { 1: 3.09 }, vintedFees: { 1: 1.85 } }
    ];

    let currentDigital = [
      { id: "d_0", title: "Absolute Power (2024-)", publisher: "DC Comics", year: "2024", category: "reading", total: 1, read: [1] },
      { id: "d_1", title: "Miles Morales: Spider-Man (2026-)", publisher: "Marvel Comics", year: "2026", category: "reading", total: 1, read: [1] },
      { id: "d_2", title: "Poison Ivy (2022-)", publisher: "DC Comics", year: "2022", category: "reading", total: 1, read: [1] },
      { id: "d_3", title: "Black Cat (2025-)", publisher: "Marvel Comics", year: "2025", category: "reading", total: 1, read: [1] },
      { id: "d_4", title: "Zatanna (2026-)", publisher: "DC Comics", year: "2026", category: "reading", total: 1, read: [1] },
      { id: "d_5", title: "The Amazing Spider-Man (2025-)", publisher: "Marvel Comics", year: "2025", category: "reading", total: 1, read: [1] },
      { id: "d_6", title: "Absolute Catwoman (2026-)", publisher: "DC Comics", year: "2026", category: "reading", total: 1, read: [1] },
      { id: "d_7", title: "Fantastic Four (2025-)", publisher: "Marvel Comics", year: "2025", category: "reading", total: 1, read: [1] },
      { id: "d_8", title: "Absolute Wonder Woman (2024-)", publisher: "DC Comics", year: "2024", category: "reading", total: 1, read: [1] },
      { id: "d_9", title: "The Amazing Spider-Man: Spider-Versity (2026-)", publisher: "Marvel Comics", year: "2026", category: "reading", total: 1, read: [1] },
      { id: "d_10", title: "Wonder Woman (2023-)", publisher: "DC Comics", year: "2023", category: "reading", total: 1, read: [1] },
      { id: "d_11", title: "Batman (2025-)", publisher: "DC Comics", year: "2025", category: "reading", total: 1, read: [1] },
      { id: "d_12", title: "Absolute Superman (2024-)", publisher: "DC Comics", year: "2024", category: "reading", total: 1, read: [1] },
      { id: "d_13", title: "Absolute Green Arrow (2026-)", publisher: "DC Comics", year: "2026", category: "reading", total: 1, read: [1] },
      { id: "d_14", title: "Absolute Batman (2024-)", publisher: "DC Comics", year: "2024", category: "reading", total: 1, read: [1] }
    ];

    let activeModalState = null;
    let openAccordions = new Set();
    let currentPubFilter = 'ALL';
    let isHuntingMode = false;
    let searchQuery = '';
    let activeSubTab = 'physical';

    function switchBottomNav(tab) {
      ['home', 'inventory', 'expenses'].forEach(t => {
        document.getElementById('view' + t.charAt(0).toUpperCase() + t.slice(1)).style.display = (t === tab) ? 'block' : 'none';
        document.getElementById('nav' + t.charAt(0).toUpperCase() + t.slice(1)).classList.toggle('active', t === tab);
      });
      if (tab === 'inventory') { renderPhysical(); renderDigital(); }
      if (tab === 'home') renderIncomingBanner();
      if (tab === 'expenses') updateExpenseStats();
    }

    function switchSubTab(sub) {
      activeSubTab = sub;
      document.getElementById('subViewPhysical').style.display = (sub === 'physical') ? 'block' : 'none';
      document.getElementById('subViewDigital').style.display = (sub === 'digital') ? 'block' : 'none';
      document.getElementById('btnSubPhysical').classList.toggle('active', sub === 'physical');
      document.getElementById('btnSubDigital').classList.toggle('active', sub === 'digital');
    }

    function toggleHuntingMode() {
      isHuntingMode = !isHuntingMode;
      document.getElementById('btn-hunt-mode').classList.toggle('active', isHuntingMode);
      renderPhysical();
    }

    function renderIncomingBanner() {
      const banner = document.getElementById('incomingBannerContainer');
      const listContainer = document.getElementById('incomingListItems');
      const countVal = document.getElementById('incomingCountVal');

      let incomingItems = [];
      currentPhysical.forEach(run => {
        if (run.incoming && run.incoming.length > 0) {
          run.incoming.forEach(num => {
            incomingItems.push({ run, num });
          });
        }
      });

      countVal.innerText = incomingItems.length;
      if (incomingItems.length > 0) {
        banner.style.display = 'block';
        listContainer.innerHTML = incomingItems.map(item => `
          <div style="display:flex; justify-content:space-between; align-items:center; padding:6px 0; border-bottom:1px solid rgba(255,255,255,0.05);">
            <span>📦 <b>${item.run.title} #${item.num}</b></span>
            <button style="background:var(--accent-orange); color:#000; font-size:0.7rem; font-weight:800; padding:4px 10px; border-radius:6px; border:none; cursor:pointer;" onclick="markArrivedQuick('${item.run.id}', ${item.num})">Ricevuto ✅</button>
          </div>
        `).join('');
      } else {
        banner.style.display = 'none';
      }
    }

    function markArrivedQuick(runId, num) {
      const run = currentPhysical.find(r => r.id === runId);
      if (run) {
        run.incoming = run.incoming.filter(n => n !== num);
        if (!run.owned.includes(num)) run.owned.push(num);
        updateHeaderStats();
        renderIncomingBanner();
        renderPhysical();
        if (activeModalState) closeModal();
      }
    }

    function renderPhysical() {
      const container = document.getElementById('physicalRunsContainer');
      container.innerHTML = '';

      currentPhysical.forEach(run => {
        if (currentPubFilter !== 'ALL' && run.category !== currentPubFilter) return;
        if (searchQuery && !run.title.toLowerCase().includes(searchQuery)) return;
        if (isHuntingMode && run.owned.length >= run.total) return;

        const ownedCount = run.owned.length;
        const pct = Math.round((ownedCount / run.total) * 100);
        const isOpen = openAccordions.has(run.id);

        const card = document.createElement('div');
        card.className = `run-card ${run.isAbandoned ? 'abandoned' : ''}`;
        card.innerHTML = `
          <button class="run-header-row" onclick="toggleAccordion('${run.id}')">
            <div>
              <div class="run-title">${run.title} ${run.isAbandoned ? '🛑' : ''}</div>
              <div class="run-meta">${run.publisher} (${run.year})</div>
            </div>
            <div class="toggle-arrow ${isOpen ? 'open' : ''}">▼</div>
          </button>
          <div class="run-body ${isOpen ? 'open' : ''}">
            <div style="display:flex; justify-content:space-between; font-size:0.75rem; color:#cbd5e1; margin-bottom:4px; margin-top:8px;">
              <span>Posseduti <b>${ownedCount}</b> su <b>${run.total}</b></span><span>${pct}%</span>
            </div>
            <div class="progress-bar-bg"><div class="progress-bar-fill" style="width: ${pct}%;"></div></div>
            <div class="numbers-grid">
              ${renderTiles(run)}
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function renderDigital() {
      const container = document.getElementById('digitalRunsContainer');
      container.innerHTML = '';

      currentDigital.forEach(run => {
        const readCount = run.read.length;
        const pct = Math.round((readCount / run.total) * 100);
        const isOpen = openAccordions.has(run.id);

        const card = document.createElement('div');
        card.className = 'run-card';
        card.innerHTML = `
          <button class="run-header-row" onclick="toggleAccordion('${run.id}')">
            <div>
              <div class="run-title">${run.title}</div>
              <div class="run-meta">${run.publisher} (${run.year})</div>
            </div>
            <div class="toggle-arrow ${isOpen ? 'open' : ''}">▼</div>
          </button>
          <div class="run-body ${isOpen ? 'open' : ''}">
            <div style="display:flex; justify-content:space-between; font-size:0.75rem; color:#cbd5e1; margin-bottom:4px; margin-top:8px;">
              <span>Letto <b>${readCount}</b> su <b>${run.total}</b></span><span>${pct}%</span>
            </div>
            <div class="progress-bar-bg"><div class="progress-bar-fill digital" style="width: ${pct}%;"></div></div>
            <div class="numbers-grid">
              ${renderDigitalTiles(run)}
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function renderTiles(run) {
      let html = '';
      for (let i = 1; i <= run.total; i++) {
        const isOwned = run.owned.includes(i);
        const isIncoming = run.incoming && run.incoming.includes(i);
        let cls = isOwned ? 'owned' : (isIncoming ? 'incoming' : '');
        html += `<button class="num-tile ${cls}" onclick="openModal('${run.id}', ${i})">${i}</button>`;
      }
      return html;
    }

    function renderDigitalTiles(run) {
      let html = '';
      for (let i = 1; i <= run.total; i++) {
        const isRead = run.read.includes(i);
        html += `<button class="num-tile ${isRead ? 'read' : ''}" onclick="openModal('${run.id}', ${i}, 'digital')">${i}</button>`;
      }
      return html;
    }

    function toggleAccordion(id) {
      if (openAccordions.has(id)) openAccordions.delete(id);
      else openAccordions.add(id);
      renderPhysical();
      renderDigital();
    }

    function filterPublisher(pub, btn) {
      currentPubFilter = pub;
      document.querySelectorAll('#chipsContainer .chip-item').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      renderPhysical();
    }

    function openModal(runId, num, mode = 'physical') {
      const run = (mode === 'physical') ? currentPhysical.find(r => r.id === runId) : currentDigital.find(r => r.id === runId);
      activeModalState = { run, num, mode };

      document.getElementById('m-title').innerText = `${run.title} #${num}`;
      document.getElementById('editTitleInput').value = run.title;
      document.getElementById('editIssueNumInput').value = num;
      document.getElementById('editPriceInput').value = (run.prices && run.prices[num]) ? run.prices[num] : 0.00;
      
      const savedUrl = (run.covers && run.covers[num]) ? run.covers[num] : '';
      document.getElementById('editCoverUrlInput').value = savedUrl;

      const coverBox = document.getElementById('m-cover');
      const placeholder = document.getElementById('m-cover-placeholder');
      
      const validUrl = fixGitHubImageUrl(savedUrl);
      if (validUrl) {
        coverBox.style.backgroundImage = `url("${validUrl}")`;
        placeholder.style.display = 'none';
      } else {
        coverBox.style.backgroundImage = 'none';
        placeholder.style.display = 'block';
        placeholder.innerHTML = `📖<br><span style="font-size:0.7rem; margin-top:4px;">${run.title}<br>#${num}</span>`;
      }

      document.getElementById('itemModal').classList.add('open');
    }

    function openAddModal() {
      activeModalState = { isNew: true };
      document.getElementById('m-title').innerText = "➕ Nuovo Volume";
      document.getElementById('editTitleInput').value = "";
      document.getElementById('editIssueNumInput').value = 1;
      document.getElementById('editPriceInput').value = "0.00";
      document.getElementById('editCoverUrlInput').value = "";
      
      const coverBox = document.getElementById('m-cover');
      coverBox.style.backgroundImage = 'none';
      document.getElementById('m-cover-placeholder').style.display = 'block';
      document.getElementById('m-cover-placeholder').innerText = "🛍️";
      
      document.getElementById('itemModal').classList.add('open');
    }

    function closeModal() {
      activeModalState = null;
      document.getElementById('itemModal').classList.remove('open');
    }

    function saveModalItem() {
      if (!activeModalState) return;

      const title = document.getElementById('editTitleInput').value.trim();
      const num = parseInt(document.getElementById('editIssueNumInput').value) || 1;
      const price = parseFloat(document.getElementById('editPriceInput').value) || 0;
      const rawUrl = document.getElementById('editCoverUrlInput').value.trim();
      const finalCoverUrl = fixGitHubImageUrl(rawUrl);

      if (activeModalState.isNew) {
        let run = currentPhysical.find(r => r.title.toLowerCase() === title.toLowerCase());
        if (!run) {
          run = { id: 'run_' + Date.now(), title, publisher: "Vari", category: "Altro", year: "2026", total: num, owned: [num], prices: {}, covers: {} };
          currentPhysical.unshift(run);
        } else {
          if (!run.owned.includes(num)) run.owned.push(num);
          if (num > run.total) run.total = num;
        }
        if (!run.prices) run.prices = {};
        if (!run.covers) run.covers = {};
        run.prices[num] = price;
        if (finalCoverUrl) run.covers[num] = finalCoverUrl;
      } else {
        const { run, num: currentNum } = activeModalState;
        if (!run.prices) run.prices = {};
        if (!run.covers) run.covers = {};
        run.prices[currentNum] = price;
        if (finalCoverUrl) run.covers[currentNum] = finalCoverUrl;
      }

      closeModal();
      updateHeaderStats();
      renderPhysical();
    }

    function updateHeaderStats() {
      let totalOwned = 0;
      let totalMissing = 0;
      let totalSpent = 0;

      currentPhysical.forEach(r => {
        totalOwned += r.owned.length;
        totalMissing += Math.max(0, r.total - r.owned.length);
        if (r.prices) {
          Object.keys(r.prices).forEach(k => {
            if (r.owned.includes(parseInt(k))) totalSpent += r.prices[k];
          });
        }
      });

      document.getElementById('st-val1').innerText = totalOwned;
      document.getElementById('st-val3').innerText = totalMissing;
      document.getElementById('st-val4').innerText = totalSpent.toFixed(2).replace('.', ',') + ' €';
      document.getElementById('cnt-phys-total').innerText = currentPhysical.length;
      document.getElementById('cnt-dig-total').innerText = currentDigital.length;
    }

    function updateExpenseStats() {
      let vintedTot = 0, vintedShip = 0, vintedFee = 0, fumTot = 0, luccaTot = 0;

      currentPhysical.forEach(r => {
        if (r.prices) {
          Object.keys(r.prices).forEach(k => {
            const num = parseInt(k);
            if (r.owned.includes(num)) {
              const src = (r.sources && r.sources[num]) ? r.sources[num] : 'fumetteria';
              const p = r.prices[num] || 0;
              const s = (r.vintedShipping && r.vintedShipping[num]) ? r.vintedShipping[num] : 0;
              const f = (r.vintedFees && r.vintedFees[num]) ? r.vintedFees[num] : 0;

              if (src === 'vinted') { vintedTot += p; vintedShip += s; vintedFee += f; }
              else if (src === 'fumetteria') { fumTot += p; }
              else if (src === 'lucca') { luccaTot += p; }
            }
          });
        }
      });

      document.getElementById('expVintedVal').innerText = vintedTot.toFixed(2).replace('.', ',') + ' €';
      document.getElementById('expVintedShipVal').innerText = vintedShip.toFixed(2).replace('.', ',') + ' €';
      document.getElementById('expVintedFeeVal').innerText = vintedFee.toFixed(2).replace('.', ',') + ' €';
      document.getElementById('expFumetteriaVal').innerText = fumTot.toFixed(2).replace('.', ',') + ' €';
      document.getElementById('expLuccaVal').innerText = luccaTot.toFixed(2).replace('.', ',') + ' €';
    }

    document.getElementById('globalSearchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.toLowerCase().trim();
      renderPhysical();
      renderDigital();
    });

    window.addEventListener('load', () => {
      updateHeaderStats();
      renderIncomingBanner();
      renderPhysical();
      renderDigital();
    });
  </script>
